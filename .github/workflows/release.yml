name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup 6
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --exact --silent --accept-source-agreements --accept-package-agreements

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          if (gh release view $tag 2>$null) { gh release delete $tag --yes }
          gh release create $tag dist\MiniTask-*-setup.exe --generate-notes --title "MiniTask $tag"
